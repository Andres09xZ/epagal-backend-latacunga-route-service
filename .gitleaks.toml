title = "Gitleaks Config - EPAGAL Backend Latacunga"

[allowlist]
description = "Archivos y patrones permitidos"
paths = [
    '''\.env\.example''',
    '''\.env\.test''',
    '''tests/.*''',
    '''\.gitleaks\.toml''',
    '''requirements\.txt''',
    '''package-lock\.json''',
    '''documentacion/.*''',
    '''database/.*\.sql''',
    '''migrations/.*\.sql''',
    '''insertar_puntos_fijos\.sql''',
    '''\.github/workflows/.*\.yml''',
]
# Ignorar commits anteriores al fix de seguridad (secretos ya removidos del código)
commits = [
    '''6d38c47''',
    '''2da3623''',
    '''f11d95f''',
    '''d489ea6''',
    '''e2042ba''',
    '''375492c''',
    '''06ee323''',
    '''b1c9bac''',
    '''0225df5''',
    '''6d0b33b''',
    '''278d829''',
    '''76b6766''',
    '''fd22cbc''',
    '''e7a3b36''',
    '''c0751bb''',
]

# Reglas personalizadas para el proyecto
[[rules]]
id = "postgres-connection-string"
description = "PostgreSQL Connection String"
regex = '''postgresql://[^:]+:[^@]+@[^/]+/\w+'''
tags = ["database", "postgresql"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*['"][A-Za-z0-9]{20,}['"]'''
tags = ["api", "key"]

[[rules]]
id = "jwt-secret"
description = "JWT Secret Key"
regex = '''(?i)(jwt[_-]?secret|secret[_-]?key)\s*[:=]\s*['"][^'"]{10,}['"]'''
tags = ["jwt", "secret"]

[[rules]]
id = "render-api-key"
description = "Render API Key"
regex = '''rnd_[A-Za-z0-9]{20,}'''
tags = ["render", "deploy"]

[[rules]]
id = "docker-hub-token"
description = "Docker Hub Access Token"
regex = '''dckr_pat_[A-Za-z0-9_-]{20,}'''
tags = ["docker", "registry"]
