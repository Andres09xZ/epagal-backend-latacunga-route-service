name: "DevSecOps Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================
  # PASO 1: Escaneo de Secretos
  # ============================================
  secret-scanning:
    name: "Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog - Detectar secretos en historial
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Gitleaks - Escaneo de secretos en código
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Búsqueda manual de patrones sensibles
        if: always()
        run: |
          echo "Buscando patrones de secretos hardcodeados..."
          echo "============================================"

          FOUND=0

          # Buscar passwords hardcodeados
          echo "Verificando passwords en código Python..."
          grep -rn "password\s*=\s*['\"]" app/ --include="*.py" | grep -v "\.env\|environ\|getenv\|config\|#\|test\|example\|DESCRIPTION\|schema\|Field\|Optional\|str\|None\|param\|doc\|help" || echo "  No se encontraron passwords hardcodeados"

          # Buscar API keys
          echo "Verificando API keys..."
          grep -rn "api_key\s*=\s*['\"]" app/ --include="*.py" | grep -v "environ\|getenv\|config\|#\|test" || echo "  No se encontraron API keys hardcodeadas"

          # Buscar tokens
          echo "Verificando tokens..."
          grep -rn "token\s*=\s*['\"][A-Za-z0-9]" app/ --include="*.py" | grep -v "environ\|getenv\|config\|#\|test\|csrf\|DESCRIPTION" || echo "  No se encontraron tokens hardcodeados"

          # Buscar connection strings
          echo "Verificando connection strings..."
          grep -rn "postgresql://\|mysql://\|mongodb://" app/ --include="*.py" | grep -v "environ\|getenv\|config\|#\|example\|localhost" || echo "  No se encontraron connection strings hardcodeadas"

          # Verificar que .env no se suba al repo
          echo "Verificando .gitignore incluye .env..."
          if grep -q "^\.env$" .gitignore 2>/dev/null; then
            echo "  .env está en .gitignore"
          else
            echo "  ADVERTENCIA: .env NO está en .gitignore"
            FOUND=1
          fi

          echo "============================================"
          if [ $FOUND -eq 1 ]; then
            echo "Se encontraron posibles problemas de secretos"
          else
            echo "Escaneo de secretos completado sin problemas críticos"
          fi

  # ============================================
  # PASO 2: Análisis de Dependencias (SCA)
  # ============================================
  dependency-check:
    name: "Dependency Security (SCA)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pip-audit - Auditoría de vulnerabilidades
        run: |
          pip install pip-audit
          echo "Ejecutando pip-audit..."
          echo "============================================"
          pip-audit -r requirements.txt --format columns || true
          echo "============================================"
          echo ""
          echo "Generando reporte en formato JSON..."
          pip-audit -r requirements.txt --format json --output pip-audit-report.json || true

      - name: Safety - Verificar CVEs conocidos
        run: |
          pip install safety
          echo "Ejecutando Safety check..."
          echo "============================================"
          safety check -r requirements.txt --full-report || true
          echo "============================================"

      - name: Análisis de dependencias desactualizadas
        run: |
          echo "Dependencias desactualizadas:"
          echo "============================================"
          pip list --outdated --format columns || true
          echo "============================================"

      - name: Verificar licencias de dependencias
        run: |
          pip install pip-licenses
          echo "Licencias de dependencias:"
          echo "============================================"
          pip-licenses --format table --with-urls || true
          echo "============================================"

      - name: Subir reporte de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # ============================================
  # PASO 3: Análisis Estático de Seguridad (SAST)
  # ============================================
  sast:
    name: "Static Application Security Testing (SAST)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar herramientas SAST
        run: |
          python -m pip install --upgrade pip
          pip install bandit flake8

      - name: Bandit - Análisis de seguridad (resumen)
        run: |
          echo "Ejecutando Bandit - Análisis de seguridad Python..."
          echo "============================================"
          bandit -r app/ -ll -ii --format screen || true
          echo "============================================"

      - name: Bandit - Generar reporte detallado JSON
        if: always()
        run: |
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Bandit - Generar reporte HTML
        if: always()
        run: |
          bandit -r app/ -f html -o bandit-report.html || true

      - name: Bandit - Análisis de severidad ALTA y CRÍTICA
        run: |
          echo "Vulnerabilidades de severidad ALTA:"
          echo "============================================"
          bandit -r app/ -ll -ii --severity-level high --format screen || echo "No se encontraron vulnerabilidades de severidad alta"
          echo "============================================"

      - name: Semgrep - SAST avanzado
        run: |
          pip install semgrep
          echo "Ejecutando Semgrep SAST..."
          echo "============================================"
          semgrep scan --config p/python --config p/flask --config p/sql-injection --config p/xss --config p/secrets --config p/owasp-top-ten --error --severity ERROR app/ || true
          echo "============================================"
          echo ""
          echo "Ejecutando Semgrep (todos los niveles, sin bloquear)..."
          semgrep scan --config p/python --config p/flask --config p/sql-injection --config p/xss --config p/secrets --config p/owasp-top-ten app/ || true

      - name: Flake8 - Análisis de calidad y seguridad
        if: always()
        run: |
          echo "Ejecutando Flake8..."
          echo "============================================"
          flake8 app/ --max-line-length 120 --statistics --count \
            --select=E9,F63,F7,F82,W6 \
            --show-source || true
          echo "============================================"

      - name: Análisis de SQL Injection patterns
        if: always()
        run: |
          echo "Buscando patrones de SQL Injection..."
          echo "============================================"

          SQLI_FOUND=0

          # f-strings con SQL
          echo "Buscando f-strings con consultas SQL..."
          RESULTS=$(grep -rn 'f".*SELECT\|f".*INSERT\|f".*UPDATE\|f".*DELETE\|f".*DROP' app/ --include="*.py" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "POSIBLE SQL INJECTION con f-strings:"
            echo "$RESULTS"
            SQLI_FOUND=1
          else
            echo "  No se encontraron f-strings SQL"
          fi

          # .format() con SQL
          echo "Buscando .format() con consultas SQL..."
          RESULTS=$(grep -rn '\.format.*SELECT\|\.format.*INSERT\|\.format.*UPDATE\|\.format.*DELETE' app/ --include="*.py" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "POSIBLE SQL INJECTION con .format():"
            echo "$RESULTS"
            SQLI_FOUND=1
          else
            echo "  No se encontraron .format() SQL"
          fi

          # Concatenación de strings con SQL
          echo "Buscando concatenación de strings SQL..."
          RESULTS=$(grep -rn '"SELECT.*" +\|"INSERT.*" +\|"UPDATE.*" +\|"DELETE.*" +' app/ --include="*.py" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "POSIBLE SQL INJECTION con concatenación:"
            echo "$RESULTS"
            SQLI_FOUND=1
          else
            echo "  No se encontraron concatenaciones SQL"
          fi

          # % formatting con SQL
          echo "Buscando % formatting con consultas SQL..."
          RESULTS=$(grep -rn '"SELECT.*%s\|"INSERT.*%s\|"UPDATE.*%s\|"DELETE.*%s' app/ --include="*.py" 2>/dev/null | grep -v "parameterized\|#" || true)
          if [ -n "$RESULTS" ]; then
            echo "POSIBLE SQL INJECTION con % formatting:"
            echo "$RESULTS"
            SQLI_FOUND=1
          else
            echo "  No se encontraron % formatting SQL"
          fi

          echo "============================================"
          if [ $SQLI_FOUND -eq 1 ]; then
            echo "Se encontraron posibles patrones de SQL Injection - Revisar manualmente"
          else
            echo "No se detectaron patrones de SQL Injection"
          fi

      - name: Análisis de XSS patterns
        if: always()
        run: |
          echo "Buscando patrones de XSS..."
          echo "============================================"

          # Buscar render_template_string (peligroso)
          echo "Buscando render_template_string..."
          grep -rn "render_template_string" app/ --include="*.py" || echo "  No se usa render_template_string"

          # Buscar Markup sin escape
          echo "Buscando Markup sin escape..."
          grep -rn "Markup(" app/ --include="*.py" | grep -v "escape" || echo "  No se encontraron Markup sin escape"

          # Buscar innerHTML en templates
          echo "Buscando innerHTML en templates..."
          grep -rn "innerHTML\|outerHTML\|document\.write" dashboard/ --include="*.html" --include="*.js" || echo "  No se encontraron patrones innerHTML"

          echo "============================================"
          echo "Análisis XSS completado"

      - name: Análisis de configuraciones inseguras
        if: always()
        run: |
          echo "Verificando configuraciones de seguridad..."
          echo "============================================"

          # Debug mode
          echo "Verificando DEBUG mode..."
          grep -rn "debug\s*=\s*True\|DEBUG\s*=\s*True" app/ --include="*.py" | grep -v "test\|#\|environ\|getenv\|config" || echo "  No se encontró debug=True hardcodeado"

          # Secret key hardcodeada
          echo "Verificando SECRET_KEY..."
          grep -rn "SECRET_KEY\s*=\s*['\"]" app/ --include="*.py" | grep -v "environ\|getenv\|config\|os\.\|#" || echo "  SECRET_KEY no está hardcodeada"

          # CORS permisivo
          echo "Verificando CORS..."
          grep -rn "allow_origins.*\*\|CORS.*origins.*\*" app/ --include="*.py" || echo "  No se encontró CORS con wildcard (*)"

          # Verificar HTTPS
          echo "Verificando uso de HTTP en lugar de HTTPS..."
          grep -rn "http://" app/ --include="*.py" | grep -v "localhost\|127\.0\.0\.1\|#\|test\|example\|0\.0\.0\.0\|osrm\|router" || echo "  No se encontraron URLs HTTP inseguras"

          echo "============================================"
          echo "Verificación de configuraciones completada"

      - name: Subir reportes SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            bandit-report.html
          retention-days: 30

  # ============================================
  # PASO 4: Seguridad SQL
  # ============================================
  sql-security:
    name: "SQL Security Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar SQLFluff
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff

      - name: SQLFluff - Lint archivos SQL de migraciones
        run: |
          echo "Ejecutando SQLFluff en archivos de migración..."
          echo "============================================"
          sqlfluff lint migrations/ --dialect postgres --rules LT01,LT02,LT04,LT09,AM01,AM02,CV01,CV02,ST06 || true
          echo "============================================"
          echo ""
          echo "Ejecutando SQLFluff en archivos SQL de base de datos..."
          sqlfluff lint database/ --dialect postgres --rules LT01,LT02,LT04,LT09,AM01,AM02,CV01,CV02,ST06 || true
          echo "============================================"

      - name: Análisis avanzado de SQL Injection en código Python
        run: |
          echo "Análisis avanzado de SQL Injection..."
          echo "============================================"

          SQLI_CRITICAL=0

          # 1. text() con f-strings (inyección directa)
          echo "[CRÍTICO] Buscando text() con f-strings..."
          RESULTS=$(grep -rn 'text(f["\x27]' app/ --include="*.py" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "SQL INJECTION DETECTADA - text() con f-string:"
            echo "$RESULTS"
            SQLI_CRITICAL=1
          else
            echo "  No se encontraron text() con f-strings"
          fi

          # 2. text() con .format()
          echo "[CRÍTICO] Buscando text() con .format()..."
          RESULTS=$(grep -rn 'text(.*\.format(' app/ --include="*.py" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "SQL INJECTION DETECTADA - text() con .format():"
            echo "$RESULTS"
            SQLI_CRITICAL=1
          else
            echo "  No se encontraron text() con .format()"
          fi

          # 3. text() con concatenación
          echo "[CRÍTICO] Buscando text() con concatenación de strings..."
          RESULTS=$(grep -rn 'text(.*+.*variable\|text(.*+.*input\|text(.*+.*param' app/ --include="*.py" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "POSIBLE SQL INJECTION - text() con concatenación:"
            echo "$RESULTS"
            SQLI_CRITICAL=1
          else
            echo "  No se encontraron concatenaciones peligrosas"
          fi

          # 4. execute() con f-strings
          echo "[CRÍTICO] Buscando execute() con f-strings..."
          RESULTS=$(grep -rn '\.execute(f["\x27]' app/ --include="*.py" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "SQL INJECTION DETECTADA - execute() con f-string:"
            echo "$RESULTS"
            SQLI_CRITICAL=1
          else
            echo "  No se encontraron execute() con f-strings"
          fi

          # 5. raw SQL con % operator
          echo "[CRÍTICO] Buscando raw SQL con operador %..."
          RESULTS=$(grep -rn 'execute(.*%\s' app/ --include="*.py" 2>/dev/null | grep -v "#\|test\|comment" || true)
          if [ -n "$RESULTS" ]; then
            echo "POSIBLE SQL INJECTION - execute() con % operator:"
            echo "$RESULTS"
            SQLI_CRITICAL=1
          else
            echo "  No se encontraron % operators en SQL"
          fi

          # 6. Verificar que se usan parámetros vinculados
          echo ""
          echo "[INFO] Verificando uso de parámetros vinculados..."
          SAFE=$(grep -rn 'text(.*:.*\|bindparam\|params=' app/ --include="*.py" 2>/dev/null | wc -l || echo "0")
          echo "  Consultas parametrizadas encontradas: $SAFE"

          echo "============================================"
          if [ $SQLI_CRITICAL -eq 1 ]; then
            echo "RESULTADO: SE ENCONTRARON VULNERABILIDADES SQL INJECTION"
            echo "Corregir antes de continuar el despliegue"
            exit 1
          else
            echo "RESULTADO: No se detectaron vulnerabilidades de SQL Injection"
          fi

      - name: Análisis de seguridad en archivos SQL
        if: always()
        run: |
          echo "Verificando seguridad en archivos SQL..."
          echo "============================================"

          ISSUES=0

          # Buscar DROP TABLE/DATABASE sin IF EXISTS
          echo "Buscando DROP sin IF EXISTS..."
          RESULTS=$(grep -rn "DROP TABLE\|DROP DATABASE" migrations/ database/ --include="*.sql" 2>/dev/null | grep -v "IF EXISTS" || true)
          if [ -n "$RESULTS" ]; then
            echo "ADVERTENCIA - DROP sin IF EXISTS:"
            echo "$RESULTS"
            ISSUES=1
          else
            echo "  Todos los DROP usan IF EXISTS"
          fi

          # Buscar GRANT ALL PRIVILEGES
          echo "Buscando privilegios excesivos..."
          RESULTS=$(grep -rn "GRANT ALL\|SUPERUSER" migrations/ database/ --include="*.sql" 2>/dev/null || true)
          if [ -n "$RESULTS" ]; then
            echo "ADVERTENCIA - Privilegios excesivos:"
            echo "$RESULTS"
            ISSUES=1
          else
            echo "  No se encontraron privilegios excesivos"
          fi

          # Buscar credenciales en SQL
          echo "Buscando credenciales en archivos SQL..."
          RESULTS=$(grep -rn "PASSWORD\s*=\s*'" migrations/ database/ --include="*.sql" 2>/dev/null | grep -v '\$BCRYPT\|placeholder\|variable\|example\|template' || true)
          if [ -n "$RESULTS" ]; then
            echo "ADVERTENCIA - Posibles credenciales en SQL:"
            echo "$RESULTS"
          else
            echo "  No se encontraron credenciales hardcodeadas"
          fi

          echo "============================================"
          if [ $ISSUES -eq 1 ]; then
            echo "Se encontraron advertencias en archivos SQL (no bloquean el pipeline)"
          else
            echo "Archivos SQL pasan las verificaciones de seguridad"
          fi

  # ============================================
  # PASO 5: Testing
  # ============================================
  testing:
    name: "Security Testing & Validation"
    runs-on: ubuntu-latest
    env:
      # Variables ficticias para CI (no se conecta a BD real)
      DB_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_test_db"
      JWT_SECRET: "ci-testing-secret-key-not-real"
      SECRET_KEY: "ci-testing-secret-key-not-real"
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Verificar imports y estructura del proyecto
        run: |
          echo "Verificando imports de la aplicación..."
          echo "============================================"

          python -c "
          import sys
          errors = []

          # Verificar módulos principales
          modules = [
              'app',
              'app.main',
              'app.database',
              'app.models',
              'app.schemas',
          ]

          for mod in modules:
              try:
                  __import__(mod)
                  print(f'  ✓ {mod}')
              except Exception as e:
                  print(f'  ✗ {mod}: {e}')
                  errors.append(mod)

          if errors:
              print(f'\n{len(errors)} módulo(s) fallaron la importación')
              sys.exit(1)
          else:
              print(f'\nTodos los módulos se importaron correctamente')
          "
          echo "============================================"

      - name: Verificar que FastAPI app se inicializa correctamente
        run: |
          echo "Verificando inicialización de FastAPI..."
          echo "============================================"

          python -c "
          import sys
          try:
              from app.main import app
              print(f'  ✓ FastAPI app creada: {app.title}')
              print(f'  ✓ Versión: {app.version}')
              print(f'  ✓ Rutas registradas: {len(app.routes)}')

              # Listar endpoints
              for route in app.routes:
                  if hasattr(route, 'methods'):
                      print(f'    {route.methods} {route.path}')
              print('\nFastAPI se inicializa correctamente')
          except Exception as e:
              print(f'  ✗ Error al inicializar FastAPI: {e}')
              sys.exit(1)
          "
          echo "============================================"

      - name: Pytest - Descubrimiento y validación de tests
        run: |
          echo "Descubriendo tests disponibles..."
          echo "============================================"
          pytest --collect-only -q tests/ features/ 2>/dev/null || echo "Algunos tests requieren servicios externos (DB, OSRM)"
          echo "============================================"

      - name: Pytest - Tests unitarios (sin dependencias externas)
        run: |
          echo "Ejecutando tests que no requieren servicios externos..."
          echo "============================================"
          pytest tests/ features/ \
            -x \
            --timeout=15 \
            --ignore=tests/test_osrm_connection.py \
            -k "not integration and not slow" \
            --tb=short \
            -q \
            2>/dev/null || echo "Tests de integración omitidos (requieren DB/servidor)"
          echo "============================================"

      - name: Verificar cobertura de archivos de seguridad
        run: |
          echo "Verificando archivos críticos de seguridad..."
          echo "============================================"

          python -c "
          import os, sys

          critical_files = {
              'app/services/auth_service.py': 'Servicio de autenticación',
              'app/database.py': 'Conexión a base de datos',
              'app/main.py': 'Aplicación principal',
          }

          missing = []
          for filepath, description in critical_files.items():
              if os.path.exists(filepath):
                  # Verificar que no tiene secrets hardcodeados
                  with open(filepath) as f:
                      content = f.read()
                  issues = []
                  if 'password' in content.lower() and '\"' in content:
                      # Verificar que usa environ/getenv
                      lines = content.split('\n')
                      for i, line in enumerate(lines, 1):
                          if 'password' in line.lower() and '=' in line:
                              if 'environ' not in line and 'getenv' not in line and '#' not in line.split('password')[0]:
                                  if 'str' not in line and 'Optional' not in line and 'Field' not in line and 'param' not in line.lower() and 'schema' not in line.lower():
                                      issues.append(f'    Línea {i}: {line.strip()[:80]}')
                  
                  if issues:
                      print(f'  ⚠ {filepath} ({description}) - posibles credenciales:')
                      for issue in issues:
                          print(issue)
                  else:
                      print(f'  ✓ {filepath} ({description})')
              else:
                  print(f'  ✗ {filepath} no encontrado')
                  missing.append(filepath)

          if missing:
              print(f'\nARCHIVOS CRÍTICOS FALTANTES: {len(missing)}')
              sys.exit(1)
          else:
              print(f'\nTodos los archivos críticos verificados')
          "
          echo "============================================"

      - name: Validación de configuración de seguridad
        run: |
          echo "Validando configuración de seguridad del proyecto..."
          echo "============================================"

          python -c "
          import sys
          checks_passed = 0
          checks_failed = 0

          # 1. Verificar .gitignore
          try:
              with open('.gitignore') as f:
                  gitignore = f.read()
              required = ['.env', '__pycache__', '*.pyc']
              for pattern in required:
                  if pattern in gitignore:
                      print(f'  ✓ .gitignore contiene {pattern}')
                      checks_passed += 1
                  else:
                      print(f'  ✗ .gitignore NO contiene {pattern}')
                      checks_failed += 1
          except FileNotFoundError:
              print('  ✗ .gitignore no encontrado')
              checks_failed += 1

          # 2. Verificar que SECRET_KEY usa env vars
          try:
              with open('app/services/auth_service.py') as f:
                  content = f.read()
              if 'environ' in content or 'getenv' in content:
                  print('  ✓ auth_service usa variables de entorno')
                  checks_passed += 1
              else:
                  print('  ✗ auth_service NO usa variables de entorno')
                  checks_failed += 1
          except FileNotFoundError:
              print('  ⚠ auth_service.py no encontrado')

          # 3. Verificar que no hay .env en el repo
          import os
          if os.path.exists('.env') and '.env' in gitignore:
              print('  ✓ .env existe pero está en .gitignore')
              checks_passed += 1
          elif not os.path.exists('.env'):
              print('  ✓ .env no está en el repositorio')
              checks_passed += 1
          else:
              print('  ✗ .env existe y NO está en .gitignore')
              checks_failed += 1

          # 4. Verificar Dockerfile no expone secrets
          try:
              with open('Dockerfile') as f:
                  content = f.read()
              if 'ENV SECRET' not in content and 'ENV PASSWORD' not in content:
                  print('  ✓ Dockerfile no expone secretos')
                  checks_passed += 1
              else:
                  print('  ✗ Dockerfile contiene secretos en ENV')
                  checks_failed += 1
          except FileNotFoundError:
              print('  ⚠ Dockerfile no encontrado')

          print(f'\nResultado: {checks_passed} verificaciones pasadas, {checks_failed} fallidas')
          if checks_failed > 0:
              sys.exit(1)
          "
          echo "============================================"

  # ============================================
  # PASO 6: Seguridad de Contenedores
  # ============================================
  container-security:
    name: "Container Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Hadolint - Lint del Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3013,DL3042
        continue-on-error: true

      - name: Hadolint - Reporte detallado
        run: |
          echo "Ejecutando Hadolint análisis detallado..."
          echo "============================================"
          docker run --rm -i hadolint/hadolint < Dockerfile || true
          echo "============================================"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker para escaneo
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: epagal-backend:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - Escaneo de vulnerabilidades de imagen
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "epagal-backend:security-scan"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Trivy - Generar reporte SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "epagal-backend:security-scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Trivy - Escaneo de filesystem (config & secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Verificar mejores prácticas de Dockerfile
        run: |
          echo "Verificando mejores prácticas del Dockerfile..."
          echo "============================================"

          ISSUES=0

          # Verificar que usa imagen slim/alpine
          if grep -q "slim\|alpine" Dockerfile; then
            echo "  ✓ Usa imagen base reducida (slim/alpine)"
          else
            echo "  ⚠ Considerar usar imagen slim o alpine"
            ISSUES=1
          fi

          # Verificar que no corre como root
          if grep -q "USER\|useradd\|adduser" Dockerfile; then
            echo "  ✓ Define usuario no-root"
          else
            echo "  ⚠ El contenedor corre como root - considerar agregar USER"
            ISSUES=1
          fi

          # Verificar HEALTHCHECK
          if grep -q "HEALTHCHECK" Dockerfile; then
            echo "  ✓ Define HEALTHCHECK"
          else
            echo "  ⚠ No define HEALTHCHECK - considerar agregar"
            ISSUES=1
          fi

          # Verificar que no copia .env o secrets
          if grep -q "COPY \.env\|ADD \.env" Dockerfile; then
            echo "  ✗ PELIGRO: Copia .env al contenedor"
            ISSUES=2
          else
            echo "  ✓ No copia .env al contenedor"
          fi

          # Verificar .dockerignore
          if [ -f ".dockerignore" ]; then
            echo "  ✓ .dockerignore existe"
          else
            echo "  ⚠ No hay .dockerignore - considerar crear uno"
            ISSUES=1
          fi

          # Verificar no-cache-dir en pip install
          if grep -q "no-cache-dir" Dockerfile; then
            echo "  ✓ pip install usa --no-cache-dir"
          else
            echo "  ⚠ Considerar agregar --no-cache-dir a pip install"
          fi

          echo "============================================"
          if [ $ISSUES -ge 2 ]; then
            echo "Se encontraron problemas críticos en el Dockerfile"
            exit 1
          elif [ $ISSUES -ge 1 ]; then
            echo "Se encontraron advertencias en el Dockerfile (no bloquean)"
          else
            echo "Dockerfile cumple con las mejores prácticas"
          fi

      - name: Subir reporte Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          retention-days: 30

  # ============================================
  # RESUMEN DE SEGURIDAD COMPLETO
  # ============================================
  security-summary:
    name: "Resumen de Seguridad DevSecOps"
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-check, sast, sql-security, testing, container-security]
    if: always()
    steps:
      - name: Generar resumen completo
        run: |
          echo "=============================================="
          echo "   REPORTE DEVSECOPS - PIPELINE COMPLETO     "
          echo "=============================================="
          echo ""
          echo "  Paso 1 - Secret Scanning:"
          echo "     Estado: ${{ needs.secret-scanning.result }}"
          echo ""
          echo "  Paso 2 - Dependency Check (SCA):"
          echo "     Estado: ${{ needs.dependency-check.result }}"
          echo ""
          echo "  Paso 3 - SAST:"
          echo "     Estado: ${{ needs.sast.result }}"
          echo ""
          echo "  Paso 4 - SQL Security:"
          echo "     Estado: ${{ needs.sql-security.result }}"
          echo ""
          echo "  Paso 5 - Testing:"
          echo "     Estado: ${{ needs.testing.result }}"
          echo ""
          echo "  Paso 6 - Container Security:"
          echo "     Estado: ${{ needs.container-security.result }}"
          echo ""
          echo "=============================================="

          # Evaluar resultado general
          FAILED=0
          WARNINGS=0

          if [ "${{ needs.secret-scanning.result }}" == "failure" ]; then
            echo "  ✗ FALLO: Se detectaron secretos expuestos"
            FAILED=1
          fi

          if [ "${{ needs.dependency-check.result }}" == "failure" ]; then
            echo "  ⚠ ADVERTENCIA: Dependencias con vulnerabilidades"
            WARNINGS=1
          fi

          if [ "${{ needs.sast.result }}" == "failure" ]; then
            echo "  ✗ FALLO: Vulnerabilidades SAST detectadas"
            FAILED=1
          fi

          if [ "${{ needs.sql-security.result }}" == "failure" ]; then
            echo "  ✗ FALLO: Vulnerabilidades SQL detectadas"
            FAILED=1
          fi

          if [ "${{ needs.testing.result }}" == "failure" ]; then
            echo "  ✗ FALLO: Tests de seguridad fallaron"
            FAILED=1
          fi

          if [ "${{ needs.container-security.result }}" == "failure" ]; then
            echo "  ✗ FALLO: Vulnerabilidades en contenedor"
            FAILED=1
          fi

          echo ""
          echo "=============================================="
          if [ $FAILED -eq 1 ]; then
            echo "  RESULTADO FINAL: ✗ FALLIDO"
            echo "  El despliegue será BLOQUEADO"
            echo "=============================================="
            exit 1
          elif [ $WARNINGS -eq 1 ]; then
            echo "  RESULTADO FINAL: ⚠ APROBADO CON ADVERTENCIAS"
            echo "  El despliegue puede continuar"
            echo "=============================================="
          else
            echo "  RESULTADO FINAL: ✓ APROBADO"
            echo "  Pipeline de seguridad superado exitosamente"
            echo "  El despliegue puede continuar"
            echo "=============================================="
          fi