name: Build and Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: mrengineer09/epagal-backend-routing
  DOCKER_TAG: latest

jobs:
  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
      
      - name: Image uploaded successfully
        run: |
          echo "Image uploaded to Docker Hub"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      deployments: write
    
    steps:
      - name: Validate secrets configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Validating secrets configuration..."
          echo ""
          
          if [ -z "$SERVICE_ID" ]; then
            echo "ERROR: RENDER_SERVICE_ID is not configured"
            exit 1
          fi
          
          if [ -z "$RENDER_API_KEY" ]; then
            echo "ERROR: RENDER_API_KEY is not configured"
            exit 1
          fi
          
          echo "SERVICE_ID configured: ${SERVICE_ID:0:15}..."
          echo "RENDER_API_KEY configured: ${RENDER_API_KEY:0:10}..."
          echo ""
          
          echo "Testing Render API connection..."
          API_TEST=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")
          
          HTTP_CODE=$(echo "$API_TEST" | tail -n1)
          RESPONSE=$(echo "$API_TEST" | head -n-1)
          
          echo "API HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Connection successful with Render API"
          else
            echo "ERROR: API connection failed"
            exit 1
          fi
      
      - name: Deploy to Render with automatic retry and monitoring
        id: render_deploy
        uses: JorgeLNJunior/render-deploy@v1.4.7
        continue-on-error: true
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: true
          wait_deploy: true
          github_deployment: true
          deployment_environment: 'production'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Retrieve Render service logs and deployment information
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          DEPLOY_STATUS="${{ steps.render_deploy.outcome }}"
          
          echo "============================================"
          if [ "$DEPLOY_STATUS" == "success" ]; then
            echo "DEPLOYMENT SUCCESSFUL - RETRIEVING LOGS"
          else
            echo "DEPLOYMENT FAILED - RETRIEVING DIAGNOSTIC INFORMATION"
          fi
          echo "============================================"
          echo ""
          
          echo "Step 1: Fetching service information..."
          echo "--------------------------------------------"
          SERVICE_INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")
          
          echo "$SERVICE_INFO" | jq '{
            id: .id,
            name: .name,
            type: .type,
            serviceDetails: .serviceDetails,
            autoDeployEnabled: .autoDeployEnabled,
            notifyOnFail: .notifyOnFail,
            createdAt: .createdAt,
            updatedAt: .updatedAt
          }' 2>/dev/null || echo "$SERVICE_INFO"
          echo ""
          
          echo "Step 2: Fetching recent deploys..."
          echo "--------------------------------------------"
          DEPLOYS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=3")
          
          DEPLOY_COUNT=$(echo "$DEPLOYS" | jq 'length' 2>/dev/null || echo "0")
          echo "Recent deploys found: $DEPLOY_COUNT"
          echo ""
          
          if [ "$DEPLOY_COUNT" -gt 0 ]; then
            LATEST_DEPLOY_ID=$(echo "$DEPLOYS" | jq -r '.[0].deploy.id' 2>/dev/null)
            LATEST_DEPLOY_STATUS=$(echo "$DEPLOYS" | jq -r '.[0].deploy.status' 2>/dev/null)
            LATEST_DEPLOY_IMAGE=$(echo "$DEPLOYS" | jq -r '.[0].deploy.image.ref' 2>/dev/null)
            
            echo "Latest deploy:"
            echo "  ID: $LATEST_DEPLOY_ID"
            echo "  Status: $LATEST_DEPLOY_STATUS"
            echo "  Image: $LATEST_DEPLOY_IMAGE"
            echo ""
            
            echo "All recent deploys:"
            echo "$DEPLOYS" | jq -r '.[] | "  - \(.deploy.id) | \(.deploy.status) | \(.deploy.createdAt)"' 2>/dev/null
            echo ""
          fi
          
          echo "Step 3: Fetching service runtime logs..."
          echo "--------------------------------------------"
          echo "Attempting to retrieve logs using different endpoints..."
          echo ""
          
          echo "Method 1: Service logs endpoint"
          SERVICE_LOGS=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/logs?limit=200")
          
          HTTP_CODE=$(echo "$SERVICE_LOGS" | tail -n1)
          LOGS_BODY=$(echo "$SERVICE_LOGS" | head -n-1)
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            LOG_COUNT=$(echo "$LOGS_BODY" | jq 'length' 2>/dev/null || echo "0")
            echo "Log entries retrieved: $LOG_COUNT"
            
            if [ "$LOG_COUNT" -gt 0 ]; then
              echo ""
              echo "COMPLETE SERVICE LOGS (last 200 entries):"
              echo "============================================"
              echo "$LOGS_BODY" | jq -r '.[] | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null || echo "$LOGS_BODY"
              echo "============================================"
              echo ""
              
              echo "FILTERING ERROR MESSAGES:"
              echo "============================================"
              ERROR_LOGS=$(echo "$LOGS_BODY" | jq -r '.[] | select(.message // .text | test("error|ERROR|Error|exception|Exception|fail|Fail|traceback|Traceback|fatal|Fatal|FATAL|crashed|Crashed|CRASHED"; "i")) | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null)
              
              if [ ! -z "$ERROR_LOGS" ]; then
                echo "$ERROR_LOGS"
              else
                echo "No error patterns found in logs"
              fi
              echo "============================================"
            else
              echo "No log entries available"
            fi
          else
            echo "Unable to retrieve service logs (HTTP $HTTP_CODE)"
            echo "Response: $LOGS_BODY"
          fi
          echo ""
          
          if [ "$DEPLOY_COUNT" -gt 0 ] && [ "$LATEST_DEPLOY_ID" != "null" ]; then
            echo "Method 2: Deploy-specific logs endpoint"
            DEPLOY_LOGS=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$LATEST_DEPLOY_ID/logs")
            
            DEPLOY_HTTP_CODE=$(echo "$DEPLOY_LOGS" | tail -n1)
            DEPLOY_LOGS_BODY=$(echo "$DEPLOY_LOGS" | head -n-1)
            
            echo "Deploy logs HTTP Status: $DEPLOY_HTTP_CODE"
            
            if [ "$DEPLOY_HTTP_CODE" = "200" ]; then
              DEPLOY_LOG_COUNT=$(echo "$DEPLOY_LOGS_BODY" | jq 'length' 2>/dev/null || echo "0")
              
              if [ "$DEPLOY_LOG_COUNT" -gt 0 ]; then
                echo "Deploy log entries: $DEPLOY_LOG_COUNT"
                echo ""
                echo "DEPLOYMENT LOGS:"
                echo "============================================"
                echo "$DEPLOY_LOGS_BODY" | jq -r '.[] | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null || echo "$DEPLOY_LOGS_BODY"
                echo "============================================"
              else
                echo "No deploy-specific logs available"
              fi
            else
              echo "Deploy logs not available via API (HTTP $DEPLOY_HTTP_CODE)"
            fi
          fi
          echo ""
          
          echo "Step 4: Analyzing failure patterns..."
          echo "--------------------------------------------"
          
          if [ "$LATEST_DEPLOY_STATUS" = "update_failed" ]; then
            echo "Status: update_failed"
            echo ""
            echo "This typically means:"
            echo "  - Application started but failed health checks"
            echo "  - Application crashed during initialization"
            echo "  - Port binding issues"
            echo ""
            echo "Common solutions:"
            echo "  1. Check if PORT environment variable is set correctly"
            echo "  2. Verify health check endpoint exists and responds"
            echo "  3. Check application logs for startup errors"
            echo "  4. Test Docker image locally:"
            echo "     docker run -p 8000:8000 $LATEST_DEPLOY_IMAGE"
          elif [ "$LATEST_DEPLOY_STATUS" = "build_failed" ]; then
            echo "Status: build_failed"
            echo ""
            echo "This means the Docker image failed to build or pull"
          elif [ "$LATEST_DEPLOY_STATUS" = "deploy_failed" ]; then
            echo "Status: deploy_failed"
            echo ""
            echo "This means deployment process encountered an error"
          fi
          echo ""
          
          echo "Step 5: Docker Hub image verification..."
          echo "--------------------------------------------"
          if [ ! -z "$LATEST_DEPLOY_IMAGE" ] && [ "$LATEST_DEPLOY_IMAGE" != "N/A" ]; then
            echo "Verifying image exists on Docker Hub: $LATEST_DEPLOY_IMAGE"
            
            DOCKER_CHECK=$(curl -s "https://hub.docker.com/v2/repositories/mrengineer09/epagal-backend-routing/tags/latest")
            
            if echo "$DOCKER_CHECK" | jq -e '.name' > /dev/null 2>&1; then
              echo "Image found on Docker Hub"
              echo "Last updated: $(echo "$DOCKER_CHECK" | jq -r '.last_updated')"
              echo "Image size: $(echo "$DOCKER_CHECK" | jq -r '.full_size' | awk '{printf "%.2f MB", $1/1024/1024}')"
            else
              echo "Unable to verify image on Docker Hub"
            fi
          fi
          echo ""
          
          echo "============================================"
          echo "DIAGNOSTIC INFORMATION COMPLETE"
          echo "============================================"
          echo ""
          echo "RECOMMENDED NEXT STEPS:"
          echo "1. Test the Docker image locally to verify it works"
          echo "2. Check Render dashboard environment variables"
          echo "3. Verify health check path is /health"
          echo "4. Ensure PORT environment variable is used in your app"
          echo "5. Check if database connections (if any) are configured"
          echo ""
          
          if [ "$DEPLOY_STATUS" != "success" ]; then
            exit 1
          fi
      
      - name: Verify application health
        if: steps.render_deploy.outcome == 'success'
        run: |
          echo "Verifying application responds correctly..."
          sleep 10
          
          HEALTH_URL="https://epagal-backend-routing-latest.onrender.com/health"
          echo "Querying: $HEALTH_URL"
          
          for i in {1..5}; do
            echo ""
            echo "Health check attempt $i/5..."
            RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_URL" 2>&1)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Response:"
              echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
              echo ""
              echo "Application responding correctly"
              exit 0
            else
              echo "Application responds with code $HTTP_CODE"
              
              if [ $i -lt 5 ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          
          echo ""
          echo "ERROR: Application did not respond correctly after 5 attempts"
          exit 1

  notify:
    name: Deployment notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-render]
    if: always()
    
    steps:
      - name: Deployment summary
        run: |
          echo ""
          echo "============================================"
          echo "PIPELINE SUMMARY"
          echo "============================================"
          echo "Docker Build: ${{ needs.build-and-push.result }}"
          echo "Render Deploy: ${{ needs.deploy-to-render.result }}"
          echo "============================================"
          echo ""
          
          if [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy-to-render.result }}" == "success" ]; then
            echo "PIPELINE COMPLETED SUCCESSFULLY"
            echo ""
            echo "Application updated on Render"
            echo ""
            echo "Useful links:"
            echo "============================================"
            echo "URL: https://epagal-backend-routing-latest.onrender.com"
            echo "Health: https://epagal-backend-routing-latest.onrender.com/health"
            echo "API Docs: https://epagal-backend-routing-latest.onrender.com/docs"
            echo "Docker Hub: https://hub.docker.com/r/${{ env.DOCKER_IMAGE }}"
            echo "============================================"
          else
            echo "PIPELINE FAILED"
            echo ""
            echo "All diagnostic information has been displayed above"
            echo "Review the 'Retrieve Render service logs' step for details"
            echo ""
            echo "Key things to check:"
            echo "  - Service runtime logs for error messages"
            echo "  - Docker image can be pulled from Docker Hub"
            echo "  - Application starts successfully locally"
            echo "  - Health check endpoint /health exists"
          fi