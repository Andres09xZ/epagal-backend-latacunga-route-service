name: Build and Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: mrengineer09/epagal-backend-routing
  DOCKER_TAG: latest

jobs:
  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
      
      - name: Image uploaded successfully
        run: |
          echo "Image uploaded to Docker Hub"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      deployments: write
    
    steps:
      - name: Validate secrets configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Validating secrets configuration..."
          echo ""
          
          if [ -z "$SERVICE_ID" ]; then
            echo "ERROR: RENDER_SERVICE_ID is not configured"
            echo ""
            echo "Configuration steps:"
            echo "  1. Go to your service at https://dashboard.render.com"
            echo "  2. URL format: https://dashboard.render.com/web/srv-XXXXX"
            echo "  3. Copy the 'srv-XXXXX' (that is your SERVICE_ID)"
            echo "  4. Go to Settings > Secrets > Actions in GitHub"
            echo "  5. Add new secret:"
            echo "     - Name: RENDER_SERVICE_ID"
            echo "     - Value: srv-XXXXX (your ID)"
            echo ""
            exit 1
          fi
          
          if [ -z "$RENDER_API_KEY" ]; then
            echo "ERROR: RENDER_API_KEY is not configured"
            echo ""
            echo "Configuration steps:"
            echo "  1. Go to https://dashboard.render.com/u/settings"
            echo "  2. Scroll to 'API Keys'"
            echo "  3. Click 'Create API Key'"
            echo "  4. Name it (e.g., GitHub Actions)"
            echo "  5. Copy the key (starts with 'rnd_')"
            echo "  6. Go to Settings > Secrets > Actions in GitHub"
            echo "  7. Add new secret:"
            echo "     - Name: RENDER_API_KEY"
            echo "     - Value: rnd_XXXXX (your key)"
            echo ""
            exit 1
          fi
          
          echo "SERVICE_ID configured: ${SERVICE_ID:0:15}..."
          echo "RENDER_API_KEY configured: ${RENDER_API_KEY:0:10}..."
          echo ""
          
          echo "Testing Render API connection..."
          API_TEST=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")
          
          HTTP_CODE=$(echo "$API_TEST" | tail -n1)
          RESPONSE=$(echo "$API_TEST" | head -n-1)
          
          echo "API HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Connection successful with Render API"
            echo ""
            echo "Service information:"
            echo "$RESPONSE" | jq '{name: .name, type: .type, region: .region, branch: .autoDeploy.branch}' 2>/dev/null || echo "$RESPONSE"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "ERROR: Invalid or expired API Key"
            echo ""
            echo "Solution:"
            echo "  1. Generate new API Key at https://dashboard.render.com/u/settings"
            echo "  2. Update RENDER_API_KEY secret in GitHub"
            exit 1
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "ERROR: Service ID not found"
            echo ""
            echo "Solution:"
            echo "  1. Verify SERVICE_ID is correct"
            echo "  2. Format should be: srv-XXXXXXXXXXXXX"
            echo "  3. Find it in Render dashboard URL"
            exit 1
          else
            echo "ERROR: Unexpected API response"
            echo "HTTP Status: $HTTP_CODE"
            echo "Response: $RESPONSE"
            exit 1
          fi
      
      - name: Deploy to Render with automatic retry and monitoring
        id: render_deploy
        uses: JorgeLNJunior/render-deploy@v1.4.7
        continue-on-error: true
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: true
          wait_deploy: true
          github_deployment: true
          deployment_environment: 'production'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Retrieve complete Render deployment logs
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          DEPLOY_STATUS="${{ steps.render_deploy.outcome }}"
          
          if [ "$DEPLOY_STATUS" == "success" ]; then
            echo "============================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "============================================"
            echo ""
          else
            echo "============================================"
            echo "DEPLOYMENT FAILED - ANALYZING LOGS"
            echo "============================================"
            echo ""
          fi
          
          echo "Fetching recent deploys from Render..."
          DEPLOYS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=3")
          
          echo "API Response:"
          echo "$DEPLOYS" | jq '.' 2>/dev/null || echo "$DEPLOYS"
          echo ""
          
          DEPLOY_COUNT=$(echo "$DEPLOYS" | jq 'length' 2>/dev/null || echo "0")
          echo "Number of recent deploys found: $DEPLOY_COUNT"
          echo ""
          
          if [ "$DEPLOY_COUNT" -gt 0 ]; then
            for i in $(seq 0 $((DEPLOY_COUNT - 1))); do
              DEPLOY_ID=$(echo "$DEPLOYS" | jq -r ".[$i].id // \"unknown\"" 2>/dev/null)
              DEPLOY_STATUS_API=$(echo "$DEPLOYS" | jq -r ".[$i].status // \"unknown\"" 2>/dev/null)
              CREATED_AT=$(echo "$DEPLOYS" | jq -r ".[$i].createdAt // \"unknown\"" 2>/dev/null)
              FINISHED_AT=$(echo "$DEPLOYS" | jq -r ".[$i].finishedAt // \"N/A\"" 2>/dev/null)
              
              echo "============================================"
              echo "DEPLOY #$((i + 1)) INFORMATION"
              echo "============================================"
              echo "  Deploy ID: $DEPLOY_ID"
              echo "  Status: $DEPLOY_STATUS_API"
              echo "  Started: $CREATED_AT"
              echo "  Finished: $FINISHED_AT"
              echo ""
              
              if [ "$DEPLOY_ID" != "unknown" ]; then
                echo "--------------------------------------------"
                echo "FETCHING COMPLETE LOGS FOR DEPLOY: $DEPLOY_ID"
                echo "--------------------------------------------"
                echo ""
                
                LOGS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
                  "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID/logs")
                
                if [ ! -z "$LOGS" ] && [ "$LOGS" != "null" ]; then
                  LOG_COUNT=$(echo "$LOGS" | jq 'length' 2>/dev/null || echo "0")
                  echo "Total log entries: $LOG_COUNT"
                  echo ""
                  
                  if [ "$LOG_COUNT" -gt 0 ]; then
                    echo "COMPLETE DEPLOYMENT LOGS:"
                    echo "============================================"
                    echo "$LOGS" | jq -r '.[] | "\(.timestamp // .createdAt // "N/A") [\(.level // "INFO")] \(.message // .text // .)"' 2>/dev/null || echo "$LOGS"
                    echo "============================================"
                    echo ""
                    
                    echo "FILTERING CRITICAL MESSAGES (errors, failures, exceptions):"
                    echo "============================================"
                    ERROR_LOGS=$(echo "$LOGS" | jq -r '.[] | select(.message // .text | test("error|ERROR|Error|exception|Exception|EXCEPTION|fail|FAIL|Fail|traceback|Traceback|TRACEBACK"; "i")) | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null)
                    
                    if [ ! -z "$ERROR_LOGS" ]; then
                      echo "$ERROR_LOGS"
                    else
                      echo "No critical error messages found in logs"
                    fi
                    echo "============================================"
                    echo ""
                    
                    if [[ "$DEPLOY_STATUS_API" =~ ^(build_failed|update_failed|deploy_failed)$ ]]; then
                      echo "LAST 50 LOG ENTRIES (most recent):"
                      echo "============================================"
                      echo "$LOGS" | jq -r '.[-50:] | .[] | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null || echo "$LOGS" | tail -n 50
                      echo "============================================"
                    fi
                  else
                    echo "No log entries available"
                  fi
                else
                  echo "No logs available from Render API for this deploy"
                  echo "This might indicate:"
                  echo "  - Deploy is still initializing"
                  echo "  - Deploy was canceled before logging started"
                  echo "  - API returned empty response"
                fi
              fi
              echo ""
            done
          else
            echo "No deploys found for this service"
            echo "This might indicate:"
            echo "  - Service was just created"
            echo "  - Deploy hasn't started yet"
            echo "  - API connection issue"
          fi
          
          echo ""
          echo "============================================"
          echo "FETCHING SERVICE RUNTIME LOGS (if available)"
          echo "============================================"
          echo ""
          
          SERVICE_LOGS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/logs?limit=100")
          
          if [ ! -z "$SERVICE_LOGS" ] && [ "$SERVICE_LOGS" != "null" ]; then
            SERVICE_LOG_COUNT=$(echo "$SERVICE_LOGS" | jq 'length' 2>/dev/null || echo "0")
            echo "Service log entries: $SERVICE_LOG_COUNT"
            
            if [ "$SERVICE_LOG_COUNT" -gt 0 ]; then
              echo ""
              echo "RECENT SERVICE LOGS:"
              echo "--------------------------------------------"
              echo "$SERVICE_LOGS" | jq -r '.[] | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null || echo "$SERVICE_LOGS"
              echo "--------------------------------------------"
            fi
          else
            echo "No service runtime logs available"
          fi
          
          echo ""
          echo "============================================"
          echo "LOG RETRIEVAL COMPLETE"
          echo "============================================"
          
          if [ "$DEPLOY_STATUS" != "success" ]; then
            exit 1
          fi
      
      - name: Verify application health
        if: steps.render_deploy.outcome == 'success'
        run: |
          echo "Verifying application responds correctly..."
          sleep 10
          
          HEALTH_URL="https://epagal-backend-routing-latest.onrender.com/health"
          echo "Querying: $HEALTH_URL"
          
          for i in {1..5}; do
            echo ""
            echo "Health check attempt $i/5..."
            RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_URL" 2>&1)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Response:"
              echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
              echo ""
              echo "Application responding correctly"
              exit 0
            else
              echo "Application responds with code $HTTP_CODE"
              
              if [ $i -lt 5 ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          
          echo ""
          echo "ERROR: Application did not respond correctly after 5 attempts"
          exit 1

  notify:
    name: Deployment notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-render]
    if: always()
    
    steps:
      - name: Deployment summary
        run: |
          echo ""
          echo "============================================"
          echo "PIPELINE SUMMARY"
          echo "============================================"
          echo "Docker Build: ${{ needs.build-and-push.result }}"
          echo "Render Deploy: ${{ needs.deploy-to-render.result }}"
          echo "============================================"
          echo ""
          
          if [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy-to-render.result }}" == "success" ]; then
            echo "PIPELINE COMPLETED SUCCESSFULLY"
            echo ""
            echo "Application updated on Render"
            echo ""
            echo "Useful links:"
            echo "============================================"
            echo "URL: https://epagal-backend-routing-latest.onrender.com"
            echo "Health: https://epagal-backend-routing-latest.onrender.com/health"
            echo "API Docs: https://epagal-backend-routing-latest.onrender.com/docs"
            echo "Docker Hub: https://hub.docker.com/r/${{ env.DOCKER_IMAGE }}"
            echo "============================================"
          else
            echo "PIPELINE FAILED"
            echo ""
            echo "All relevant logs have been displayed above"
            echo "Review the 'Retrieve complete Render deployment logs' step for detailed error information"
          fi