name: Build and Deploy to Render

on:
  push:
    branches:
      - main  # Se ejecuta cuando hay push a main
  pull_request:
    branches:
      - main  # También cuando hay PR a main
  workflow_dispatch:  # Permite ejecución manual desde GitHub

env:
  DOCKER_IMAGE: mrengineer09/epagal-backend-routing
  DOCKER_TAG: latest

jobs:
  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extraer metadata de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
      
      - name: Build y Push de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
      
      - name: Imagen subida exitosamente
        run: |
          echo "Imagen Docker subida a Docker Hub"
          echo "Imagen: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push  # Se ejecuta después de subir la imagen
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # Solo en push a main
    outputs:
      deploy_status: ${{ steps.check_deploy.outputs.status }}
      deploy_id: ${{ steps.trigger_deploy.outputs.deploy_id }}
    
    steps:
      - name: Trigger Render Deploy
        id: trigger_deploy
        run: |
          echo "🚀 Iniciando deploy en Render..."
          RESPONSE=$(curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.deploy.id')
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "✅ Deploy disparado con ID: $DEPLOY_ID"
      
      - name: Esperar y verificar deploy
        id: check_deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d4us303uibrs73f675mg
        run: |
          echo "⏳ Esperando a que Render complete el deploy..."
          echo "📍 Service ID: $SERVICE_ID"
          
          MAX_ATTEMPTS=20  # 20 intentos x 15 segundos = 5 minutos máximo
          ATTEMPT=0
          DEPLOY_STATUS="building"
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "🔍 Intento $ATTEMPT/$MAX_ATTEMPTS - Verificando estado del deploy..."
            
            # Obtener el último deploy del servicio
            DEPLOYS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=1")
            
            DEPLOY_STATUS=$(echo $DEPLOYS | jq -r '.[0].deploy.status' 2>/dev/null || echo "unknown")
            DEPLOY_ID=$(echo $DEPLOYS | jq -r '.[0].deploy.id' 2>/dev/null || echo "unknown")
            
            echo "� Estado actual: $DEPLOY_STATUS (Deploy ID: $DEPLOY_ID)"
            
            # Verificar si el deploy completó (exitoso o fallido)
            if [ "$DEPLOY_STATUS" = "live" ]; then
              echo "✅ Deploy completado exitosamente!"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$DEPLOY_STATUS" = "build_failed" ] || [ "$DEPLOY_STATUS" = "deactivated" ] || [ "$DEPLOY_STATUS" = "deploy_failed" ]; then
              echo "❌ Deploy falló con estado: $DEPLOY_STATUS"
              echo "status=failed" >> $GITHUB_OUTPUT
              
              # Obtener logs del deploy fallido
              echo ""
              echo "📋 Obteniendo logs del error en Render..."
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🔴 LOGS DE ERROR DE RENDER:"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              # Obtener logs recientes del servicio
              LOGS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$SERVICE_ID/logs?limit=100")
              
              # Extraer y mostrar las últimas líneas con errores
              echo "$LOGS" | jq -r '.[] | select(.message | contains("Error") or contains("error") or contains("Failed") or contains("failed") or contains("Traceback") or contains("ImportError") or contains("Exception")) | .message' 2>/dev/null | tail -n 50
              
              # Si no hay mensajes filtrados, mostrar los últimos 30 logs
              if [ -z "$(echo "$LOGS" | jq -r '.[] | select(.message | contains("Error") or contains("error")) | .message' 2>/dev/null)" ]; then
                echo ""
                echo "📄 Últimos 30 logs del servicio:"
                echo "$LOGS" | jq -r '.[].message' 2>/dev/null | tail -n 30
              fi
              
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🔗 Ver logs completos en: https://dashboard.render.com/web/$SERVICE_ID/logs"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            elif [ "$DEPLOY_STATUS" = "unknown" ]; then
              echo "⚠️  No se pudo obtener el estado del deploy. Reintentando..."
            else
              echo "⏳ Deploy en progreso (estado: $DEPLOY_STATUS)..."
            fi
            
            sleep 15  # Esperar 15 segundos entre intentos
          done
          
          echo "⏰ Timeout: El deploy tomó más de 5 minutos"
          echo "status=timeout" >> $GITHUB_OUTPUT
          exit 1
      
      - name: Verificar aplicación
        if: steps.check_deploy.outputs.status == 'success'
        run: |
          echo "🔍 Verificando que la aplicación responda correctamente..."
          sleep 5  # Dar tiempo a que la app inicie completamente
          
          HEALTH_URL="https://epagal-backend-routing-latest.onrender.com/health"
          RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "📊 HTTP Status: $HTTP_CODE"
          echo "📦 Response:"
          echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Aplicación respondiendo correctamente!"
          else
            echo "⚠️  Aplicación responde con código $HTTP_CODE"
            exit 1
          fi


  notify:
    name: Notificación de Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-render]
    if: always()
    
    steps:
      - name: Resumen del Deploy
        run: |
          echo "📊 Resumen del Pipeline:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Build Docker: ${{ needs.build-and-push.result }}"
          echo "Deploy Render: ${{ needs.deploy-to-render.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy-to-render.result }}" == "success" ]; then
            echo "✅ Pipeline completado exitosamente"
            echo "🎉 La aplicación está actualizada en Render"
            echo ""
            echo "🌐 URL de la aplicación:"
            echo "   https://epagal-backend-routing-latest.onrender.com"
            echo ""
            echo "🔍 Verificar health check:"
            echo "   https://epagal-backend-routing-latest.onrender.com/health"
            echo ""
            echo "📚 Documentación API:"
            echo "   https://epagal-backend-routing-latest.onrender.com/docs"
          else
            echo "❌ El pipeline falló. Revisa los logs arriba."
          fi
