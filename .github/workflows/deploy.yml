name: Build and Deploy to Render

on:
  # Se ejecuta SOLO cuando el pipeline DevSecOps completa exitosamente
  workflow_run:
    workflows: ["DevSecOps Pipeline"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: mrengineer09/epagal-backend-routing
  DOCKER_TAG: latest

jobs:
  # ============================================
  # Gate: Verificar que DevSecOps pasó
  # ============================================
  security-gate:
    name: "Security Gate - Verificar DevSecOps"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Verificar resultado del pipeline DevSecOps
        run: |
          echo "============================================"
          echo "  SECURITY GATE - VERIFICACIÓN"
          echo "============================================"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "  Trigger: Ejecución manual (workflow_dispatch)"
            echo "  ⚠ Se omite verificación DevSecOps"
          else
            echo "  Trigger: Pipeline DevSecOps completado"
            echo "  Workflow: ${{ github.event.workflow_run.name }}"
            echo "  Resultado: ${{ github.event.workflow_run.conclusion }}"
            echo "  Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "  Commit: ${{ github.event.workflow_run.head_sha }}"
          fi

          echo ""
          echo "  ✓ Autorizado para despliegue"
          echo "============================================"

  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: security-gate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
      
      - name: Image uploaded successfully
        run: |
          echo "Image uploaded to Docker Hub"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    permissions:
      deployments: write
    
    steps:
      - name: Validate secrets configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Validating secrets configuration..."
          echo ""
          
          if [ -z "$SERVICE_ID" ]; then
            echo "ERROR: RENDER_SERVICE_ID is not configured"
            exit 1
          fi
          
          if [ -z "$RENDER_API_KEY" ]; then
            echo "ERROR: RENDER_API_KEY is not configured"
            exit 1
          fi
          
          echo "SERVICE_ID configured: ${SERVICE_ID:0:15}..."
          echo "RENDER_API_KEY configured: ${RENDER_API_KEY:0:10}..."
          echo ""
          
          echo "Testing Render API connection..."
          API_TEST=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")
          
          HTTP_CODE=$(echo "$API_TEST" | tail -n1)
          RESPONSE=$(echo "$API_TEST" | head -n-1)
          
          echo "API HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Connection successful with Render API"
          else
            echo "ERROR: API connection failed"
            exit 1
          fi
      
      - name: Deploy to Render with automatic retry and monitoring
        id: render_deploy
        uses: JorgeLNJunior/render-deploy@v1.5.0
        continue-on-error: true
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: true
          wait_deploy: true
          github_deployment: true
          deployment_environment: 'production'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Retrieve service logs and deployment information
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          DEPLOY_STATUS="${{ steps.render_deploy.outcome }}"
          
          echo "============================================"
          echo "Step 1: Fetching service information..."
          echo "--------------------------------------------"
          SERVICE_INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")
          
          echo "$SERVICE_INFO" | jq '{
            id: .id,
            name: .name,
            type: .type,
            region: .serviceDetails.region,
            plan: .serviceDetails.plan,
            url: .serviceDetails.url
          }' 2>/dev/null || echo "$SERVICE_INFO"
          echo ""
          
          echo "Step 3: Fetching recent deploys..."
          echo "--------------------------------------------"
          DEPLOYS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=3")
          
          DEPLOY_COUNT=$(echo "$DEPLOYS" | jq 'length' 2>/dev/null || echo "0")
          echo "Recent deploys found: $DEPLOY_COUNT"
          echo ""
          
          if [ "$DEPLOY_COUNT" -gt 0 ]; then
            LATEST_DEPLOY_ID=$(echo "$DEPLOYS" | jq -r '.[0].deploy.id' 2>/dev/null)
            LATEST_DEPLOY_STATUS=$(echo "$DEPLOYS" | jq -r '.[0].deploy.status' 2>/dev/null)
            LATEST_DEPLOY_IMAGE=$(echo "$DEPLOYS" | jq -r '.[0].deploy.image.ref' 2>/dev/null)
            LATEST_DEPLOY_CREATED=$(echo "$DEPLOYS" | jq -r '.[0].deploy.createdAt' 2>/dev/null)
            LATEST_DEPLOY_FINISHED=$(echo "$DEPLOYS" | jq -r '.[0].deploy.finishedAt' 2>/dev/null)
            
            echo "Latest deploy:"
            echo "  ID: $LATEST_DEPLOY_ID"
            echo "  Status: $LATEST_DEPLOY_STATUS"
            echo "  Image: $LATEST_DEPLOY_IMAGE"
            echo "  Started: $LATEST_DEPLOY_CREATED"
            echo "  Finished: $LATEST_DEPLOY_FINISHED"
            echo ""
            
            echo "All recent deploys:"
            echo "$DEPLOYS" | jq -r '.[] | "  - \(.deploy.id) | \(.deploy.status) | \(.deploy.createdAt)"' 2>/dev/null
            echo ""
          fi
          
          echo "Step 2: Retrieving service logs from multiple sources..."
          echo "============================================"
          
          # Try multiple endpoints to get logs
          echo "Attempting to fetch logs from Render API..."
          echo ""
          
          # Method 1: Try to get logs from the main logs endpoint
          echo "→ Trying logs endpoint..."
          LOGS_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/logs?limit=200")
          
          LOGS_HTTP_CODE=$(echo "$LOGS_RESPONSE" | tail -n1)
          LOGS_BODY=$(echo "$LOGS_RESPONSE" | head -n-1)
          
          if [ "$LOGS_HTTP_CODE" = "200" ] && [ ! -z "$LOGS_BODY" ] && [ "$LOGS_BODY" != "404 page not found" ]; then
            echo "Logs retrieved successfully from logs endpoint!"
            echo "============================================"
            echo "SERVICE LOGS (Last 200 entries):"
            echo "============================================"
            echo "$LOGS_BODY" | jq -r '.[] | "\(.timestamp) [\(.level)]: \(.message)"' 2>/dev/null || echo "$LOGS_BODY"
            echo ""
            
            # Filter and highlight errors
            echo "============================================"
            echo "FILTERING CRITICAL ERRORS:"
            echo "============================================"
            echo "$LOGS_BODY" | jq -r '.[] | select(.level == "error" or .level == "ERROR" or (.message | test("error|Error|ERROR|exception|Exception|traceback|Traceback|ModuleNotFoundError|ImportError"; "i"))) | "\(.timestamp) [\(.level)]: \(.message)"' 2>/dev/null || echo "No errors found in structured logs"
          else
            echo "- Logs endpoint returned HTTP $LOGS_HTTP_CODE"
            
            # Method 2: Try events endpoint
            echo ""
            echo "Trying events endpoint..."
            EVENTS_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/events?limit=100")
            
            EVENTS_HTTP_CODE=$(echo "$EVENTS_RESPONSE" | tail -n1)
            EVENTS_BODY=$(echo "$EVENTS_RESPONSE" | head -n-1)
            
            if [ "$EVENTS_HTTP_CODE" = "200" ] && [ ! -z "$EVENTS_BODY" ] && [ "$EVENTS_BODY" != "404 page not found" ]; then
              echo "Events retrieved successfully!"
              echo "============================================"
              echo "SERVICE EVENTS:"
              echo "============================================"
              echo "$EVENTS_BODY" | jq -r '.[] | "\(.timestamp // .createdAt) - \(.type): \(.message // .description)"' 2>/dev/null || echo "$EVENTS_BODY"
            else
              echo "- Events endpoint returned HTTP $EVENTS_HTTP_CODE"
              
              # Method 3: Try to get deploy-specific logs
              if [ ! -z "$LATEST_DEPLOY_ID" ]; then
                echo ""
                echo "Trying deploy-specific logs for $LATEST_DEPLOY_ID..."
                DEPLOY_LOGS_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
                  "https://api.render.com/v1/services/$SERVICE_ID/deploys/$LATEST_DEPLOY_ID/logs")
                
                DEPLOY_LOGS_HTTP_CODE=$(echo "$DEPLOY_LOGS_RESPONSE" | tail -n1)
                DEPLOY_LOGS_BODY=$(echo "$DEPLOY_LOGS_RESPONSE" | head -n-1)
                
                if [ "$DEPLOY_LOGS_HTTP_CODE" = "200" ] && [ ! -z "$DEPLOY_LOGS_BODY" ] && [ "$DEPLOY_LOGS_BODY" != "404 page not found" ]; then
                  echo "Deploy logs retrieved successfully!"
                  echo "============================================"
                  echo "DEPLOY LOGS:"
                  echo "============================================"
                  echo "$DEPLOY_LOGS_BODY"
                else
                  echo "- Deploy logs returned HTTP $DEPLOY_LOGS_HTTP_CODE"
                fi
              fi
              
              # Method 4: Check service health directly
              echo ""
              echo "Checking service health..."
              SERVICE_URL=$(echo "$SERVICE_INFO" | jq -r '.serviceDetails.url' 2>/dev/null)
              
              if [ ! -z "$SERVICE_URL" ] && [ "$SERVICE_URL" != "null" ]; then
                echo "Service URL: $SERVICE_URL"
                HEALTH_RESPONSE=$(curl -s -w "\n%{http_code}" "$SERVICE_URL/health" 2>/dev/null || echo -e "\n000")
                HEALTH_HTTP_CODE=$(echo "$HEALTH_RESPONSE" | tail -n1)
                HEALTH_BODY=$(echo "$HEALTH_RESPONSE" | head -n-1)
                
                echo "Health check HTTP code: $HEALTH_HTTP_CODE"
                if [ "$HEALTH_HTTP_CODE" = "200" ]; then
                  echo "- Service is healthy!"
                  echo "$HEALTH_BODY"
                  
                  # If health check passes, test critical endpoints
                  echo ""
                  echo "Testing critical API endpoints..."
                  echo ""
                  
                  # Test 1: GET incidencias
                  echo "Test 1: GET /api/incidencias/"
                  INCIDENCIAS_RESPONSE=$(curl -s -w "\n%{http_code}" "$SERVICE_URL/api/incidencias/" 2>/dev/null || echo -e "\n000")
                  INCIDENCIAS_CODE=$(echo "$INCIDENCIAS_RESPONSE" | tail -n1)
                  echo "  Response code: $INCIDENCIAS_CODE"
                  if [ "$INCIDENCIAS_CODE" = "200" ]; then
                    echo "  ✓ Endpoint working correctly"
                  else
                    echo "  - Endpoint failed"
                    echo "  Response: $(echo "$INCIDENCIAS_RESPONSE" | head -n-1 | head -c 500)"
                  fi
                  echo ""
                  
                  # Test 2: GET docs (FastAPI auto-documentation)
                  echo "Test 2: GET /docs"
                  DOCS_RESPONSE=$(curl -s -w "\n%{http_code}" "$SERVICE_URL/docs" 2>/dev/null || echo -e "\n000")
                  DOCS_CODE=$(echo "$DOCS_RESPONSE" | tail -n1)
                  echo "  Response code: $DOCS_CODE"
                  if [ "$DOCS_CODE" = "200" ]; then
                    echo "  + API documentation accessible"
                  else
                    echo "  - Documentation not accessible"
                  fi
                  echo ""
                  
                  # Test 3: Database connectivity through API
                  echo "Test 3: Database connectivity check"
                  DB_CHECK=$(curl -s "$SERVICE_URL/api/incidencias/" | jq 'type' 2>/dev/null || echo "error")
                  if [ "$DB_CHECK" = "array" ] || [ "$DB_CHECK" = "object" ]; then
                    echo "  + Database connection working (API returned valid JSON)"
                  else
                    echo "  - Database might have issues (unexpected response format)"
                  fi
                  
                else
                  echo "- Service health check failed"
                  echo "$HEALTH_BODY"
                  echo ""
                  echo "Possible causes:"
                  echo "  - Application failed to start"
                  echo "  - Python module import errors"
                  echo "  - Database connection issues"
                  echo "  - Port binding problems"
                fi
              fi
            fi
          fi
          echo ""
          
          echo "Step 3: Analyzing deployment status..."
          echo "--------------------------------------------"
          
          if [ "$LATEST_DEPLOY_STATUS" = "update_failed" ]; then
            echo "Status: update_failed"
            echo ""
            echo "This typically means:"
            echo "  - Application crashed during initialization"
            echo "  - Health check endpoint not responding"
            echo "  - Port binding issues"
            echo "  - Missing dependencies or configuration"
            echo ""
            echo "Check the logs above for:"
            echo "  - ModuleNotFoundError (missing Python packages)"
            echo "  - ImportError (import issues)"
            echo "  - Port binding errors"
            echo "  - Database connection errors"
            echo "  - Environment variable issues"
            echo ""
            echo "Test Docker image locally:"
            echo "  docker run -p 8000:8000 -e PORT=8000 $LATEST_DEPLOY_IMAGE"
          elif [ "$LATEST_DEPLOY_STATUS" = "build_failed" ]; then
            echo "Status: build_failed"
            echo "The Docker image failed to build or pull from Docker Hub"
          elif [ "$LATEST_DEPLOY_STATUS" = "deploy_failed" ]; then
            echo "Status: deploy_failed"
            echo "Deployment process encountered an error"
          fi
          echo ""
          
          echo "Step 6: Docker Hub image verification..."
          echo "--------------------------------------------"
          if [ ! -z "$LATEST_DEPLOY_IMAGE" ] && [ "$LATEST_DEPLOY_IMAGE" != "N/A" ]; then
            echo "Verifying image exists on Docker Hub: $LATEST_DEPLOY_IMAGE"
            
            DOCKER_CHECK=$(curl -s "https://hub.docker.com/v2/repositories/mrengineer09/epagal-backend-routing/tags/latest")
            
            if echo "$DOCKER_CHECK" | jq -e '.name' > /dev/null 2>&1; then
              echo "Image found on Docker Hub"
              echo "Last updated: $(echo "$DOCKER_CHECK" | jq -r '.last_updated')"
              echo "Image size: $(echo "$DOCKER_CHECK" | jq -r '.full_size' | awk '{printf "%.2f MB", $1/1024/1024}')"
            else
              echo "Unable to verify image on Docker Hub"
            fi
          fi
          echo ""
          
          echo "============================================"
          echo "DEPLOYMENT SUMMARY"
          echo "============================================"
          echo ""
          echo "Service Information:"
          echo "  Name: epagal-backend-routing:latest"
          echo "  Status: $LATEST_DEPLOY_STATUS"
          echo "  Region: oregon"
          echo "  Plan: free"
          echo "  URL: $SERVICE_URL"
          echo ""
          echo "Deploy Information:"
          echo "  Deploy ID: $LATEST_DEPLOY_ID"
          echo "  Started: $LATEST_DEPLOY_CREATED"
          echo "  Finished: $LATEST_DEPLOY_FINISHED"
          echo "  Image: $LATEST_DEPLOY_IMAGE"
          echo ""
          
          if [ "$HEALTH_HTTP_CODE" = "200" ]; then
            echo "SERVICE STATUS: HEALTHY AND OPERATIONAL"
            echo ""
            echo "Your API is accessible at:"
            echo "  Base URL: $SERVICE_URL"
            echo "  Docs: $SERVICE_URL/docs"
            echo "  Health: $SERVICE_URL/health"
            echo "  Incidencias: $SERVICE_URL/api/incidencias/"
          else
            echo "SERVICE STATUS: UNHEALTHY"
            echo ""
            echo "The service deployed but is not responding correctly."
            echo "This usually means there's a runtime error."
            echo ""
            echo "To debug, check the Render dashboard logs:"
            echo "  https://dashboard.render.com/web/$SERVICE_ID/logs"
            echo ""
            echo "Common issues to look for:"
            echo "  - ModuleNotFoundError - Missing Python dependencies"
            echo "  - ImportError - Package compatibility issues"  
            echo "  - Database connection errors"
            echo "  - Environment variable issues"
          fi
          echo ""
          echo "============================================"
          echo ""
          
          if [ "$DEPLOY_STATUS" != "success" ]; then
            exit 1
          fi
      
      - name: Verify application health
        if: steps.render_deploy.outcome == 'success'
        run: |
          echo "Verifying application responds correctly..."
          sleep 10
          
          HEALTH_URL="https://epagal-backend-routing-latest.onrender.com/health"
          echo "Querying: $HEALTH_URL"
          
          for i in {1..5}; do
            echo ""
            echo "Health check attempt $i/5..."
            RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_URL" 2>&1)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Response:"
              echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
              echo ""
              echo "Application responding correctly"
              exit 0
            else
              echo "Application responds with code $HTTP_CODE"
              
              if [ $i -lt 5 ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          
          echo ""
          echo "ERROR: Application did not respond correctly after 5 attempts"
          exit 1

  notify:
    name: Deployment notification
    runs-on: ubuntu-latest
    needs: [security-gate, build-and-push, deploy-to-render]
    if: always()
    
    steps:
      - name: Deployment summary
        run: |
          echo ""
          echo "============================================"
          echo "PIPELINE SUMMARY - DEPLOY CON DEVSECOPS"
          echo "============================================"
          echo "Security Gate: ${{ needs.security-gate.result }}"
          echo "Docker Build: ${{ needs.build-and-push.result }}"
          echo "Render Deploy: ${{ needs.deploy-to-render.result }}"
          echo "============================================"
          echo ""
          
          if [ "${{ needs.security-gate.result }}" != "success" ]; then
            echo "PIPELINE BLOQUEADO POR SECURITY GATE"
            echo ""
            echo "El pipeline DevSecOps no pasó correctamente."
            echo "Revise el workflow 'DevSecOps Pipeline' para ver los errores."
            exit 1
          elif [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy-to-render.result }}" == "success" ]; then
            echo "PIPELINE COMPLETED SUCCESSFULLY"
            echo ""
            echo "Application updated on Render"
            echo ""
            echo "Useful links:"
            echo "============================================"
            echo "URL: https://epagal-backend-routing-latest.onrender.com"
            echo "Health: https://epagal-backend-routing-latest.onrender.com/health"
            echo "API Docs: https://epagal-backend-routing-latest.onrender.com/docs"
            echo "Docker Hub: https://hub.docker.com/r/${{ env.DOCKER_IMAGE }}"
            echo "============================================"
          else
            echo "PIPELINE FAILED"
            echo ""
            echo "All diagnostic information has been displayed above"
            echo "Review the 'Retrieve Render service logs' step for details"
            echo ""
            echo "Key things to check:"
            echo "  - Service runtime logs for error messages"
            echo "  - Docker image can be pulled from Docker Hub"
            echo "  - Application starts successfully locally"
            echo "  - Health check endpoint /health exists"
          fi