name: Build and Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: mrengineer09/epagal-backend-routing
  DOCKER_TAG: latest

jobs:
  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
      
      - name: Image uploaded successfully
        run: |
          echo "Image uploaded to Docker Hub"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      deployments: write
    
    steps:
      - name: Validate secrets configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Validating secrets configuration..."
          echo ""
          
          if [ -z "$SERVICE_ID" ]; then
            echo "ERROR: RENDER_SERVICE_ID is not configured"
            exit 1
          fi
          
          if [ -z "$RENDER_API_KEY" ]; then
            echo "ERROR: RENDER_API_KEY is not configured"
            exit 1
          fi
          
          echo "SERVICE_ID configured: ${SERVICE_ID:0:15}..."
          echo "RENDER_API_KEY configured: ${RENDER_API_KEY:0:10}..."
          echo ""
          
          echo "Testing Render API connection..."
          API_TEST=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")
          
          HTTP_CODE=$(echo "$API_TEST" | tail -n1)
          RESPONSE=$(echo "$API_TEST" | head -n-1)
          
          echo "API HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Connection successful with Render API"
          else
            echo "ERROR: API connection failed"
            exit 1
          fi
      
      - name: Deploy to Render with automatic retry and monitoring
        id: render_deploy
        uses: JorgeLNJunior/render-deploy@v1.4.7
        continue-on-error: true
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: true
          wait_deploy: true
          github_deployment: true
          deployment_environment: 'production'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Retrieve complete Render deployment logs
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          DEPLOY_STATUS="${{ steps.render_deploy.outcome }}"
          
          if [ "$DEPLOY_STATUS" == "success" ]; then
            echo "============================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "============================================"
            echo ""
          else
            echo "============================================"
            echo "DEPLOYMENT FAILED - ANALYZING LOGS"
            echo "============================================"
            echo ""
          fi
          
          echo "Fetching recent deploys from Render..."
          DEPLOYS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=3")
          
          echo "API Response:"
          echo "$DEPLOYS" | jq '.' 2>/dev/null || echo "$DEPLOYS"
          echo ""
          
          DEPLOY_COUNT=$(echo "$DEPLOYS" | jq 'length' 2>/dev/null || echo "0")
          echo "Number of recent deploys found: $DEPLOY_COUNT"
          echo ""
          
          if [ "$DEPLOY_COUNT" -gt 0 ]; then
            for i in $(seq 0 $((DEPLOY_COUNT - 1))); do
              DEPLOY_ID=$(echo "$DEPLOYS" | jq -r ".[$i].deploy.id // \"unknown\"" 2>/dev/null)
              DEPLOY_STATUS_API=$(echo "$DEPLOYS" | jq -r ".[$i].deploy.status // \"unknown\"" 2>/dev/null)
              CREATED_AT=$(echo "$DEPLOYS" | jq -r ".[$i].deploy.createdAt // \"unknown\"" 2>/dev/null)
              FINISHED_AT=$(echo "$DEPLOYS" | jq -r ".[$i].deploy.finishedAt // \"N/A\"" 2>/dev/null)
              IMAGE_REF=$(echo "$DEPLOYS" | jq -r ".[$i].deploy.image.ref // \"N/A\"" 2>/dev/null)
              IMAGE_SHA=$(echo "$DEPLOYS" | jq -r ".[$i].deploy.image.sha // \"N/A\"" 2>/dev/null)
              
              echo "============================================"
              echo "DEPLOY #$((i + 1)) INFORMATION"
              echo "============================================"
              echo "  Deploy ID: $DEPLOY_ID"
              echo "  Status: $DEPLOY_STATUS_API"
              echo "  Started: $CREATED_AT"
              echo "  Finished: $FINISHED_AT"
              echo "  Image: $IMAGE_REF"
              echo "  Image SHA: $IMAGE_SHA"
              echo ""
              
              if [ "$DEPLOY_ID" != "unknown" ] && [ "$DEPLOY_ID" != "null" ]; then
                echo "--------------------------------------------"
                echo "FETCHING LOGS FOR DEPLOY: $DEPLOY_ID"
                echo "--------------------------------------------"
                echo ""
                
                LOGS_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" \
                  "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID/logs")
                
                HTTP_CODE=$(echo "$LOGS_RESPONSE" | tail -n1)
                LOGS=$(echo "$LOGS_RESPONSE" | head -n-1)
                
                echo "Logs API HTTP Status: $HTTP_CODE"
                
                if [ "$HTTP_CODE" = "200" ]; then
                  if [ ! -z "$LOGS" ] && [ "$LOGS" != "null" ] && [ "$LOGS" != "[]" ]; then
                    LOG_COUNT=$(echo "$LOGS" | jq 'length' 2>/dev/null || echo "0")
                    echo "Total log entries: $LOG_COUNT"
                    echo ""
                    
                    if [ "$LOG_COUNT" -gt 0 ]; then
                      echo "COMPLETE DEPLOYMENT LOGS:"
                      echo "============================================"
                      echo "$LOGS" | jq -r '.[] | "\(.timestamp // .createdAt // "N/A") [\(.level // "INFO")] \(.message // .text // .)"' 2>/dev/null || echo "$LOGS"
                      echo "============================================"
                      echo ""
                      
                      echo "FILTERING CRITICAL MESSAGES:"
                      echo "============================================"
                      ERROR_LOGS=$(echo "$LOGS" | jq -r '.[] | select(.message // .text | test("error|ERROR|Error|exception|Exception|EXCEPTION|fail|FAIL|Fail|traceback|Traceback|TRACEBACK|ModuleNotFoundError|ImportError|SyntaxError"; "i")) | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null)
                      
                      if [ ! -z "$ERROR_LOGS" ]; then
                        echo "$ERROR_LOGS"
                      else
                        echo "No critical error messages found in logs"
                      fi
                      echo "============================================"
                      echo ""
                      
                      if [[ "$DEPLOY_STATUS_API" =~ ^(build_failed|update_failed|deploy_failed)$ ]]; then
                        echo "LAST 100 LOG ENTRIES (most recent):"
                        echo "============================================"
                        echo "$LOGS" | jq -r '.[-100:] | .[] | "\(.timestamp // .createdAt // "N/A") - \(.message // .text // .)"' 2>/dev/null || echo "$LOGS" | tail -n 100
                        echo "============================================"
                      fi
                    else
                      echo "No log entries available"
                    fi
                  else
                    echo "No logs returned from API (empty or null response)"
                  fi
                elif [ "$HTTP_CODE" = "404" ]; then
                  echo "Deploy logs not found (404). Deploy may be too old or not yet started."
                elif [ "$HTTP_CODE" = "401" ]; then
                  echo "Authentication error (401). Check API key permissions."
                else
                  echo "Unexpected API response: HTTP $HTTP_CODE"
                  echo "Response: $LOGS"
                fi
              else
                echo "Skipping log fetch - invalid deploy ID"
              fi
              echo ""
            done
          else
            echo "No deploys found for this service"
          fi
          
          echo ""
          echo "============================================"
          echo "ANALYSIS SUMMARY"
          echo "============================================"
          
          if [ "$DEPLOY_COUNT" -gt 0 ]; then
            FIRST_DEPLOY_STATUS=$(echo "$DEPLOYS" | jq -r ".[0].deploy.status // \"unknown\"" 2>/dev/null)
            
            if [ "$FIRST_DEPLOY_STATUS" = "update_failed" ]; then
              echo "Latest deploy status: update_failed"
              echo ""
              echo "Common causes for update_failed:"
              echo "  1. Application fails to start (check startup logs)"
              echo "  2. Health check endpoint not responding"
              echo "  3. Port configuration mismatch"
              echo "  4. Missing environment variables"
              echo "  5. Database connection issues"
              echo "  6. Python/dependency errors"
              echo ""
              echo "Recommended actions:"
              echo "  1. Review the complete logs above"
              echo "  2. Check if application starts locally with same Docker image"
              echo "  3. Verify environment variables in Render dashboard"
              echo "  4. Ensure health check endpoint (/health) is accessible"
            fi
          fi
          
          echo ""
          echo "============================================"
          echo "LOG RETRIEVAL COMPLETE"
          echo "============================================"
          
          if [ "$DEPLOY_STATUS" != "success" ]; then
            exit 1
          fi
      
      - name: Verify application health
        if: steps.render_deploy.outcome == 'success'
        run: |
          echo "Verifying application responds correctly..."
          sleep 10
          
          HEALTH_URL="https://epagal-backend-routing-latest.onrender.com/health"
          echo "Querying: $HEALTH_URL"
          
          for i in {1..5}; do
            echo ""
            echo "Health check attempt $i/5..."
            RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_URL" 2>&1)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Response:"
              echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
              echo ""
              echo "Application responding correctly"
              exit 0
            else
              echo "Application responds with code $HTTP_CODE"
              
              if [ $i -lt 5 ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          
          echo ""
          echo "ERROR: Application did not respond correctly after 5 attempts"
          exit 1

  notify:
    name: Deployment notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-render]
    if: always()
    
    steps:
      - name: Deployment summary
        run: |
          echo ""
          echo "============================================"
          echo "PIPELINE SUMMARY"
          echo "============================================"
          echo "Docker Build: ${{ needs.build-and-push.result }}"
          echo "Render Deploy: ${{ needs.deploy-to-render.result }}"
          echo "============================================"
          echo ""
          
          if [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy-to-render.result }}" == "success" ]; then
            echo "PIPELINE COMPLETED SUCCESSFULLY"
            echo ""
            echo "Application updated on Render"
            echo ""
            echo "Useful links:"
            echo "============================================"
            echo "URL: https://epagal-backend-routing-latest.onrender.com"
            echo "Health: https://epagal-backend-routing-latest.onrender.com/health"
            echo "API Docs: https://epagal-backend-routing-latest.onrender.com/docs"
            echo "Docker Hub: https://hub.docker.com/r/${{ env.DOCKER_IMAGE }}"
            echo "============================================"
          else
            echo "PIPELINE FAILED"
            echo ""
            echo "All relevant logs have been displayed above"
            echo "Review the 'Retrieve complete Render deployment logs' step for detailed error information"
          fi