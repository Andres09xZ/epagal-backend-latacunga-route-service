# Configuración de Dependabot para monitoreo continuo de dependencias
# Fase 6 (Monitor) del ciclo DevSecOps
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Monitorear dependencias de Python (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Guayaquil"
    # Límite de PRs abiertas simultáneamente
    open-pull-requests-limit: 10
    # Prefijo para los commits
    commit-message:
      prefix: "deps"
      include: "scope"
    # Labels para los PRs
    labels:
      - "dependencies"
      - "security"
    # Revisar vulnerabilidades de seguridad con prioridad
    # Dependabot Security Updates se activan automáticamente

  # Monitorear GitHub Actions (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci/cd"
      - "dependencies"

  # Monitorear dependencias de Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "docker"
      - "dependencies"
