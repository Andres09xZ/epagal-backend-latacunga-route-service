# pytest.ini
[pytest]
# pytest-bdd configuration
bdd_features_base_dir = features/

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    -p no:warnings
    
# Markers
markers =
    bdd: BDD tests using pytest-bdd
    geofencing: Geofencing system tests
    integration: Integration tests requiring database
    unit: Unit tests
    slow: Slow tests

# Coverage
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
